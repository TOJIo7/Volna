name: Собрать APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать приложение
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Volna.apk

      - name: Сохранить APK в разделе Actions
        uses: actions/upload-artifact@v4
        with:
          name: Volna-apk
          path: Volna.apk

      - name: Опубликовать в Releases (прямая ссылка для телефона)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Volna.apk --title "Волна — последняя сборка" --notes "Собрано автоматически из коммита ${GITHUB_SHA::7}. Скачай Volna.apk и установи на телефон."
